[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snapseek"
version = "0.1.0"
description = "A local screenshot inventory and search learning project"
requires-python = ">=3.11,<3.14"
dependencies = ["pytesseract>=0.3.10", "scikit-learn>=1.6", "fastembed>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]
